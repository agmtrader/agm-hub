name: Compile Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Hub API error transport regressions
        run: node --test scripts/test-api-errors.cjs scripts/test-read-batches.cjs scripts/test-application-sync-feedback.cjs scripts/test-application-company-contacts.cjs scripts/test-application-sync-queue.cjs scripts/test-risk-deposit.cjs

      - name: Image optimizer security regressions
        run: node --test scripts/test-next-image-security.cjs

      - name: Next.js build
        run: yarn build
